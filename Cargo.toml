[workspace]
resolver = "2"
members = [
    "crates/sholes-core",
    "crates/sholes-cli",
]
exclude = ["crates/sholes-core/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/hyperpolymath/sholes"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
