# SPDX-License-Identifier: MPL-2.0
# CodeRabbit reviews changes; humans and authorised agents own changes.
# Canonical estate language policy:
# https://github.com/metadatastician/standards/blob/main/3-practice/LANGUAGE-POLICY.adoc
# This template must never permit unsolicited AI-generated fixes/commits.
reviews:
  path_instructions:
    - path: "**/*"
      instructions: >-
        Enforce the canonical estate language policy: Python is prohibited
        for all NEW work, without exceptions. Do not suggest Python
        implementations or tests, and flag newly added/modified Python
        files or dependency manifests as policy violations. Use the owning
        project's approved language and runtime. Pre-existing third-party
        code is not permission to author new Python. Do not demand language
        migrations of unrelated upstream dependencies as cosmetic PR work.
  pre_merge_checks:
    docstrings:
      mode: warning
      threshold: 80
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
