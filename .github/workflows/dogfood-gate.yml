# SPDX-License-Identifier: MPL-2.0
# Copyright (c) 2026 Jonathan D.A. Jewell (hyperpolymath) <j.d.a.jewell@open.ac.uk>
#
# dogfood-gate.yml — Hyperpolymath Dogfooding Quality Gate
# Validates that the repo uses hyperpolymath's own formats and tools.
# Companion to static-analysis-gate.yml (security) and fork-governance.yml (PR
# DEED/K9/Hypatia lanes + unified grid comment).
name: Dogfood Gate

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: DEED conformance on push (pull_request runs in fork-governance.yml
  # per metadatastician/standards 3-practice/fork-governance/ADOPTION.adoc §3).
  # ---------------------------------------------------------------------------
  deed-validate:
    name: Validate DEED manifests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout canonical DEED validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metadatastician/standards
          ref: f0b3cd4c464d33e1584f8528c17bce104555e256
          path: .standards-deed
          sparse-checkout: |
            1-formats/deed
            scripts
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'
      - name: Run DEED validation hook
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/standards-deed"
          mv "$PWD/.standards-deed" "$RUNNER_TEMP/standards-deed"
          if [ -f .machine_readable/a2ml-legacy-allow.txt ] && [ ! -f "$RUNNER_TEMP/standards-deed/scripts/check-a2ml-archived.sh" ]; then
            echo "::error::A2ML ledger present but scripts/check-a2ml-archived.sh is missing from the standards checkout"
            exit 1
          fi
          STANDARDS_DIR="$RUNNER_TEMP/standards-deed" bash .github/hooks/validate-deed.sh

  # ---------------------------------------------------------------------------
  # Job 2: K9 conformance on push (pull_request runs in fork-governance.yml).
  # ---------------------------------------------------------------------------
  k9-validate:
    name: Validate K9 contracts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NICKEL_VERSION: '1.18.0'
      NICKEL_SHA256: '9cba4dd65ae9915ec61f73033aafcff307a377665a83fd8f530df086763318cb'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout canonical K9 validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metadatastician/standards
          ref: f0b3cd4c464d33e1584f8528c17bce104555e256
          path: .standards-k9
          sparse-checkout: 1-formats/k9
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Install sha256-verified Nickel CLI
        run: |
          set -euo pipefail
          URL="https://github.com/tweag/nickel/releases/download/${NICKEL_VERSION}/nickel-x86_64-linux"
          curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 -o "$RUNNER_TEMP/nickel" "$URL"
          echo "${NICKEL_SHA256}  ${RUNNER_TEMP}/nickel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/nickel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'

      - name: Run K9 validation hook
        id: validate
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/standards-k9"
          mv "$PWD/.standards-k9" "$RUNNER_TEMP/standards-k9"
          if [ ! -f "$RUNNER_TEMP/standards-k9/1-formats/k9/tools/k9-validate.sh" ]; then
            echo "::error::K9 validator is missing from the standards checkout"
            exit 1
          fi
          if ! command -v nickel >/dev/null 2>&1; then
            echo "::error::nickel is required for K9 layer L2 validation"
            exit 1
          fi
          STANDARDS_DIR="$RUNNER_TEMP/standards-k9" bash .github/hooks/validate-k9.sh

      # The state -> badge mapping lives in scripts/governance-badge.js and
      # nowhere else. It used to be this inline jq, which wrote `skipped` and
      # `cancelled` in RED. The renderer is shared with the publisher, so the
      # artifact and the published badge cannot drift apart.
      - name: Generate K9 badge
        if: always()
        env:
          K9_RESULT: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k9-grid"
          bun scripts/governance-badge.js render \
            --label K9 \
            --state "${K9_RESULT:-unknown}" \
            --out "$RUNNER_TEMP/k9-grid/badge.json"
          cat "$RUNNER_TEMP/k9-grid/badge.json"

      - name: Upload K9 grid
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k9-grid
          path: ${{ runner.temp }}/k9-grid/badge.json
          if-no-files-found: error

  # The live README badge: badges/k9.json (shields endpoint schema) published to
  # the generated `governance-badges` ORPHAN branch on every push to main.
  #
  # Operational contract (the long form is in .github/workflows/README.adoc):
  #   * the branch is generated output - no common ancestor with main, no PR,
  #     never merged. That is why the branch is built with `parents: []` and
  #     never with main's head;
  #   * identical bytes produce NO commit;
  #   * only a `success` lane result may render brightgreen;
  #   * skipped, cancelled, unavailable and unrecognised states render
  #     lightgrey. Running with a skipped lane PUBLISHES grey; it must never
  #     leave a previous green badge in place, which is why this job no longer
  #     excludes `needs.k9-validate.result == 'skipped'`.
  #
  # scripts/governance-badge.js owns the whole decision, so it can be unit
  # tested without a repository, a token or a network.
  badges:
    name: Publish the lane badges
    needs: k9-validate
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    # One publisher at a time per repository. The contents API is ALSO
    # sha-checked, so a race that slips past the queue is detected (409) and
    # re-evaluated against what the other run wrote instead of blindly
    # overwriting it.
    concurrency:
      group: governance-badges-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'

      # Deliberately non-fatal: a missing artifact IS a lane state ("we have no
      # evidence"), and failing here would leave the previous badge - possibly
      # a green one - in place. The publisher turns it into a grey
      # "unavailable" badge and then fails the step, so the run is still red
      # and the badge still stops claiming success.
      - name: Download the lane grid
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: k9-grid
          path: ${{ runner.temp }}/k9-grid

      - name: Publish badges/k9.json to the governance-badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANE_RESULT: ${{ needs.k9-validate.result }}
          ARTIFACT: ${{ runner.temp }}/k9-grid/badge.json
          BRANCH: governance-badges
          DEST: badges/k9.json
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bun scripts/governance-badge.js publish \
            --label K9 \
            --lane-result "$LANE_RESULT" \
            --artifact "$ARTIFACT" \
            --branch "$BRANCH" \
            --path "$DEST" \
            --repo "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA"

  # ---------------------------------------------------------------------------
  # Job 3: Empty-linter — invisible character detection
  # ---------------------------------------------------------------------------
  empty-lint:
    name: "🔴 GATE: Empty-linter (invisible characters)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for invisible characters
        id: lint
        run: |
          RESULTS_FILE="$RUNNER_TEMP/empty-lint-results.bin"
          BLOCKING_FILE="$RUNNER_TEMP/empty-lint-blocking-results.bin"
          if ! scripts/check-invisible-characters.sh \
              "$GITHUB_WORKSPACE" "$RESULTS_FILE" "$BLOCKING_FILE"; then
            echo "::error::Invisible-character scanner failed; refusing a partial pass"
            exit 2
          fi

          FINDINGS=0
          while IFS= read -r -d '' filepath; do
            FINDINGS=$((FINDINGS + 1))
            REL_PATH="${filepath#"$GITHUB_WORKSPACE"/}"
            SAFE_PATH="${REL_PATH//'%'/'%25'}"
            SAFE_PATH="${SAFE_PATH//$'\r'/'%0D'}"
            SAFE_PATH="${SAFE_PATH//$'\n'/'%0A'}"
            SAFE_PATH="${SAFE_PATH//':'/'%3A'}"
            SAFE_PATH="${SAFE_PATH//','/'%2C'}"
            echo "::warning file=${SAFE_PATH}::Invisible Unicode or C0 characters detected"
          done < "$RESULTS_FILE"

          BLOCKING=0
          while IFS= read -r -d '' filepath; do
            BLOCKING=$((BLOCKING + 1))
            REL_PATH="${filepath#"$GITHUB_WORKSPACE"/}"
            SAFE_PATH="${REL_PATH//'%'/'%25'}"
            SAFE_PATH="${SAFE_PATH//$'\r'/'%0D'}"
            SAFE_PATH="${SAFE_PATH//$'\n'/'%0A'}"
            SAFE_PATH="${SAFE_PATH//':'/'%3A'}"
            SAFE_PATH="${SAFE_PATH//','/'%2C'}"
            echo "::error file=${SAFE_PATH}::C0 control character or NUL byte detected"
          done < "$BLOCKING_FILE"

          echo "findings=$FINDINGS" >> "$GITHUB_OUTPUT"
          echo "blocking=$BLOCKING" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

          if [ "$BLOCKING" -gt 0 ]; then
            echo "## Empty-linter: BLOCKED — $BLOCKING file(s) contain C0/NUL corruption" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Write summary
        env:
          READY: ${{ steps.lint.outputs.ready }}
          FINDINGS: ${{ steps.lint.outputs.findings }}
        run: |
          if [ "$READY" = "true" ]; then
            if [ "${FINDINGS:-0}" -gt 0 ] 2>/dev/null; then
              echo "## Empty-Linter Results" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Found **${FINDINGS}** invisible character issue(s). See annotations above." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "## Empty-Linter Results" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo ":white_check_mark: No invisible character issues found." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "## Empty-Linter" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Skipped: empty-linter not available." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Job 4: Groove manifest check (for repos that should expose services)
  # ---------------------------------------------------------------------------
  groove-check:
    name: "🟡 CHECK: Groove manifest check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Groove manifest
        id: groove
        run: |
          HAS_MANIFEST="false"
          HAS_GROOVE_CODE="false"

          MANIFEST=""
          if [ -f "www/.well-known/groove/manifest.json" ]; then
            MANIFEST="www/.well-known/groove/manifest.json"
          elif [ -f ".well-known/groove/manifest.json" ]; then
            MANIFEST=".well-known/groove/manifest.json"
            echo "::warning::Groove manifest at legacy root .well-known/ — canonical location is www/.well-known/ (run scripts/migrate-wellknown-to-www.sh)"
          fi

          if [ -n "$MANIFEST" ]; then
            HAS_MANIFEST="true"
            if ! jq empty "$MANIFEST" 2>/dev/null; then
              echo "::error file=$MANIFEST::Invalid JSON in Groove manifest"
              exit 1
            else
              SVC_ID=$(jq -r '.service_id // "unknown"' "$MANIFEST")
              echo "service_id=$SVC_ID" >> "$GITHUB_OUTPUT"
            fi
          fi

          if grep -rl 'well-known/groove' --include='*.rs' --include='*.ex' --include='*.zig' --include='*.v' --include='*.res' . 2>/dev/null | head -1 | grep -q .; then
            HAS_GROOVE_CODE="true"
          fi

          HAS_SERVER="false"
          if grep -rl 'Bandit\|Plug.Cowboy\|httpz\|vweb\|axum::serve\|actix_web\|hyper::Server\|rocket::build\|warp::serve' --include='*.rs' --include='*.ex' --include='*.zig' --include='*.v' . 2>/dev/null | head -1 | grep -q .; then
            HAS_SERVER="true"
          fi

          echo "has_manifest=$HAS_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "has_groove_code=$HAS_GROOVE_CODE" >> "$GITHUB_OUTPUT"
          echo "has_server=$HAS_SERVER" >> "$GITHUB_OUTPUT"

          if [ "$HAS_SERVER" = "true" ] && [ "$HAS_MANIFEST" = "false" ] && [ "$HAS_GROOVE_CODE" = "false" ]; then
            echo "::warning::This repo has server code but no Groove endpoint. Add www/.well-known/groove/manifest.json for service discovery."
          fi

      - name: Write summary
        env:
          HAS_MANIFEST: ${{ steps.groove.outputs.has_manifest }}
          HAS_GROOVE_CODE: ${{ steps.groove.outputs.has_groove_code }}
          HAS_SERVER: ${{ steps.groove.outputs.has_server }}
        run: |
          {
            echo "## Groove Protocol Check"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Static manifest (www/.well-known/groove/manifest.json) | ${HAS_MANIFEST} |"
            echo "| Groove endpoint in code | ${HAS_GROOVE_CODE} |"
            echo "| Has HTTP server code | ${HAS_SERVER} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 5: eclexiaiser manifest validation
  # ---------------------------------------------------------------------------
  eclexiaiser-validate:
    name: Validate eclexiaiser manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check and validate eclexiaiser manifest
        id: eclex
        run: |
          if [ ! -f "eclexiaiser.toml" ]; then
            if [ -f "Containerfile" ]; then
              echo "::warning::Containerfile present but no eclexiaiser.toml. Run \`eclexiaiser init\` to scaffold energy/carbon budgets."
            fi
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_manifest=true" >> "$GITHUB_OUTPUT"
          err=0
          grep -qE '^[[:space:]]*\[project\]'        eclexiaiser.toml || { echo "::error file=eclexiaiser.toml::[project] section is required"; err=1; }
          grep -qE '^[[:space:]]*name[[:space:]]*=[[:space:]]*"[^"]+"' eclexiaiser.toml || { echo "::error file=eclexiaiser.toml::a non-empty name is required"; err=1; }
          grep -qE '^[[:space:]]*\[\[functions\]\]'  eclexiaiser.toml || { echo "::error file=eclexiaiser.toml::at least one [[functions]] entry is required"; err=1; }
          if [ "$err" -ne 0 ]; then
            exit 1
          fi
          fns=$(grep -cE '^[[:space:]]*\[\[functions\]\]' eclexiaiser.toml)
          echo "Valid: eclexiaiser.toml structure present (${fns} function block(s))"

      - name: Write summary
        env:
          HAS_MANIFEST: ${{ steps.eclex.outputs.has_manifest }}
        run: |
          if [ "$HAS_MANIFEST" = "true" ]; then
            echo "## Eclexiaiser Manifest" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo ":white_check_mark: **eclexiaiser.toml** present and valid." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Eclexiaiser Manifest" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo ":ballot_box_with_check: No eclexiaiser.toml. Add one with \`eclexiaiser init\` for energy/carbon tracking." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Job 6: Canon lockstep — does this template still implement the canon?
  # ---------------------------------------------------------------------------
  canon-lockstep:
    name: Canon lockstep
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The decision is scripts/canon-pin-check.sh (tested offline by
      # tests/workflows/canon_pin_check_test.sh); these steps only fetch.
      # Two-phase lockstep: the spine may adopt a canon AHEAD of its release
      # by naming the open canon PR in the clause (:proposed-by
      # "metadatastician/standards#N"); the pin must then equal canon.lock at
      # that PR's head. Standards Gate A checks the other side.
      - name: Checkout repository (for the decision script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare this repo's declared pin with the canon
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          # gh reads the token from the environment, so it never appears in a
          # command line (where a curl -H would put it in the process list).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANON_REPO="metadatastician/standards"
          LOCK="$RUNNER_TEMP/canon.lock"
          URL="https://raw.githubusercontent.com/${CANON_REPO}/main/canon.lock"
          if ! curl -fsSL --retry 3 --max-time 30 "$URL" -o "$LOCK"; then
            echo "::error::could not fetch canon.lock from $URL"
            exit 1
          fi
          DEED_NAME="${REPO#*/}_chora.deed"
          DEED="$RUNNER_TEMP/repo.deed"
          if ! gh api -H "Accept: application/vnd.github.raw" \
              "repos/${REPO}/contents/${DEED_NAME}?ref=${HEAD_SHA}" > "$DEED"; then
            echo "::error::no $DEED_NAME at ${HEAD_SHA:0:7} — this repo cannot declare a canon pin"
            exit 1
          fi
          echo "deed: $DEED_NAME @ ${HEAD_SHA:0:7}"
          OUT="$RUNNER_TEMP/released.md"
          rc=0
          bash scripts/canon-pin-check.sh released "$DEED" "$LOCK" > "$OUT" || rc=$?
          { echo "## Canon lockstep"; echo ""; grep -vE '^(PROPOSED_BY|LAGS_BEHIND)=' "$OUT" || true; echo ""; } >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT"
          case "$rc" in
            0) echo ":white_check_mark: This template implements the released canon." >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            1) echo "::error::canon lockstep broken — the template does not implement the canon at HEAD (adopt it, or name the canon PR with :proposed-by)"; exit 1 ;;
            3) ;;
            *) echo "::error::canon lockstep could not compare (malformed pin or lock)"; exit 1 ;;
          esac
          # Two-phase: the pin names an unreleased canon PR. Check that PR.
          ref="$(sed -n 's/^PROPOSED_BY=//p' "$OUT")"
          lags="$(sed -n 's/^LAGS_BEHIND=//p' "$OUT")"
          num="${ref##*#}"
          PR_JSON="$RUNNER_TEMP/pr.json"
          if ! gh api "repos/${CANON_REPO}/pulls/${num}" > "$PR_JSON"; then
            echo "::error::could not read ${CANON_REPO}#${num}, which this deed's :proposed-by names"
            exit 1
          fi
          state="$(jq -r '.state' "$PR_JSON")"
          [ "$(jq -r '.merged' "$PR_JSON")" = "true" ] && state="merged"
          head="$(jq -r '.head.sha' "$PR_JSON")"
          if ! printf '%s' "$head" | grep -qxE '[0-9a-f]{40}'; then
            echo "::error::${CANON_REPO}#${num} has no readable head commit"
            exit 1
          fi
          PLOCK="$RUNNER_TEMP/pending.lock"
          if ! curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 --max-time 30 \
              "https://raw.githubusercontent.com/${CANON_REPO}/${head}/canon.lock" -o "$PLOCK"; then
            echo "::error::could not fetch canon.lock at ${CANON_REPO}@${head:0:7}"
            exit 1
          fi
          POUT="$RUNNER_TEMP/pending.md"
          prc=0
          bash scripts/canon-pin-check.sh pending "$DEED" "$PLOCK" "$state" ${lags:+"$lags"} > "$POUT" || prc=$?
          { echo "### Adopted ahead of release: ${ref} (${state}, head ${head:0:7})"; echo ""; cat "$POUT"; echo ""; } >> "$GITHUB_STEP_SUMMARY"
          cat "$POUT"
          if [ "$prc" = 0 ]; then
            echo ":white_check_mark: This template adopts ${ref} ahead of its release (spine-adopts-then-canon-releases)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::canon lockstep broken — the pin follows ${ref}, which is ${state} or no longer matches"
          exit 1

  # ---------------------------------------------------------------------------
  # Job 7: Dogfooding summary
  # ---------------------------------------------------------------------------
  dogfood-summary:
    name: "ℹ️ ADVISORY: Dogfooding compliance summary (non-gating)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [deed-validate, k9-validate, empty-lint, groove-check, eclexiaiser-validate, canon-lockstep]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate dogfooding scorecard
        run: |
          SCORE=0
          MAX=6
          if find . -name '*.deed' -not -path './.git/*' | head -1 | grep -q .; then
            SCORE=$((SCORE + 1)); DEED_STATUS=":white_check_mark:"
          else
            DEED_STATUS=":x:"
          fi
          if find . \( -name '*.k9' -o -name '*.k9.ncl' \) -not -path './.git/*' | head -1 | grep -q .; then
            SCORE=$((SCORE + 1)); K9_STATUS=":white_check_mark:"
          else
            K9_STATUS=":x:"
          fi
          if [ -f ".editorconfig" ]; then
            SCORE=$((SCORE + 1)); EC_STATUS=":white_check_mark:"
          else
            EC_STATUS=":x:"
          fi
          if [ -f "www/.well-known/groove/manifest.json" ] || [ -f ".well-known/groove/manifest.json" ] || grep -rl 'well-known/groove' --include='*.rs' --include='*.ex' --include='*.zig' . 2>/dev/null | head -1 | grep -q .; then
            SCORE=$((SCORE + 1)); GROOVE_STATUS=":white_check_mark:"
          else
            GROOVE_STATUS=":ballot_box_with_check:"
          fi
          if grep -rl 'verisimdb\|VeriSimDB' --include='*.toml' --include='*.yaml' --include='*.yml' --include='*.kyaml' --include='*.json' --include='*.rs' --include='*.ex' . 2>/dev/null | head -1 | grep -q .; then
            SCORE=$((SCORE + 1)); VSDB_STATUS=":white_check_mark:"
          else
            VSDB_STATUS=":ballot_box_with_check:"
          fi
          if [ -f "eclexiaiser.toml" ]; then
            SCORE=$((SCORE + 1)); ECLEX_STATUS=":white_check_mark:"
          else
            ECLEX_STATUS=":ballot_box_with_check:"
          fi
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Dogfooding Scorecard

          **Score: ${SCORE}/${MAX}**

          | Tool/Format | Status | Notes |
          |-------------|--------|-------|
          | DEED repo deed (\`<reponame>_chora.deed\`) | ${DEED_STATUS} | Required for all RSR repos |
          | K9 contracts | ${K9_STATUS} | Required for repos with config files |
          | .editorconfig | ${EC_STATUS} | Required for all repos |
          | Groove endpoint | ${GROOVE_STATUS} | Required for service repos |
          | VeriSimDB integration | ${VSDB_STATUS} | Required for stateful repos |
          | eclexiaiser | ${ECLEX_STATUS} | Energy/carbon budgets for container services |
          EOF

  rsr-score-self:
    name: RSR oracle — dogfood this repo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metadatastician/standards
          ref: f0b3cd4c464d33e1584f8528c17bce104555e256
          path: _standards
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperpolymath/hypatia
          # Pinned to a Hypatia commit that contains hypatia#1062 (the PinSites miscompile
          # fix, merged as 37b8d01). The earlier pin be98f74 lacks it.
          ref: 51539abf3d2472b955da9b051a68c5971f6cfa22
          path: _hypatia
          persist-credentials: false
      # OTP 28.x (28.1 to 28.5.0.8) crashes this step with SIGSEGV in
      # sweep_off_heap, called from the JIT's bs_init_bits, on trees whose
      # workflow content trips it (sholes#333). OTP 27.3 scored all
      # of them cleanly. Do not move to 28.x until a pinned 28.x build scores
      # the #333 trees (af8665c, a55669e, 6ad5378) with no crash.
      - name: Setup Elixir 1.19.4 / OTP 27.3.4.19 for Hypatia oracle
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: '27.3.4.19'
      - name: Cache Hypatia Mix deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _hypatia/deps
            _hypatia/_build
            ~/.hex
            ~/.mix
          key: hypatia-oracle-${{ runner.os }}-otp27.3.4.19-elx1194-51539abf3d2472b955da9b051a68c5971f6cfa22
      - name: Compile the oracle
        working-directory: _hypatia
        run: mix local.hex --force && mix local.rebar --force && mix deps.get && mix compile
      - name: Score this repo against the canon
        working-directory: _hypatia
        run: |
          mix hypatia.rsr_score ../subject \
            --ssot ../_standards/0-canon/rsr/rsr-criteria-v2.a2ml
